name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ffe14d&color_dots=#ebedf0,#c9d4f6,#8ea3ee,#2546d8,#0f1b3d
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffe14d&color_dots=#161b22,#0f1b3d,#1e2f7a,#2546d8,#8ea3ee

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
